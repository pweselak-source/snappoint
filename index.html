<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snapPoint — dokumenty formalne</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("snappoint.theme") || "snappoint";
          if (theme && theme !== "snappoint") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="appSidebar" aria-label="Nawigacja główna">
        <div class="sidebar-brand">
          <a href="#" class="brand-mark" data-view="dashboard" aria-label="snapPoint — Pulpit">
            <span class="brand-full">snappoint</span><span class="brand-short" aria-hidden="true">snpp</span><span class="dot">.</span>
          </a>
          <p class="brand-sub">Dokumenty formalne projektu</p>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-label">Workspace</p>
          <a class="nav-item is-active" href="#" data-view="dashboard" title="Pulpit">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" />
              </svg>
            </span>
            <span class="nav-text">Pulpit</span>
          </a>
          <a class="nav-item" href="#" data-view="users" title="Użytkownicy">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1" />
                <circle cx="9.5" cy="7.5" r="3" />
                <path d="M19 19v-1a3.5 3.5 0 0 0-2.5-3.35" />
                <path d="M16 4.6a3 3 0 0 1 0 5.8" />
              </svg>
            </span>
            <span class="nav-text">Użytkownicy</span>
          </a>
          <a class="nav-item" href="#" data-view="permissions" title="Uprawnienia">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M12 3 4.5 6.5v5.2c0 4.4 3.1 7.9 7.5 9.3 4.4-1.4 7.5-4.9 7.5-9.3V6.5L12 3Z" />
                <path d="m9.5 12 1.7 1.7 3.5-3.6" />
              </svg>
            </span>
            <span class="nav-text">Uprawnienia</span>
          </a>
          <a class="nav-item" href="#" data-view="configuration" title="Konfiguracja">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.5l1.6 1.6M17.6 15.9l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.5l1.6-1.6M17.6 8.1l1.6-1.6" stroke-linecap="round" />
              </svg>
            </span>
            <span class="nav-text">Konfiguracja</span>
          </a>

          <p class="nav-label">Konto</p>
          <a class="nav-item" href="#" data-view="account" title="Zarządzanie kontem">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3.5" y="6.5" width="17" height="12" rx="2" />
                <path d="M3.5 10.5h17" />
                <path d="M7 14.2h3.2" stroke-linecap="round" />
              </svg>
            </span>
            <span class="nav-text">Zarządzanie kontem</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <p class="powered-by">
            Powered by
            <span class="adapto-mark">adapto<span class="dot">.</span></span>
          </p>
          <button
            type="button"
            class="sidebar-rail-toggle desktop-only"
            data-role="toggle-sidebar-rail"
            title="Zwiń menu"
            aria-label="Zwiń menu boczne"
            aria-expanded="true"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M11 7 6 12l5 5" />
              <path d="M18 7l-5 5 5 5" />
            </svg>
          </button>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-btn sidebar-toggle"
              id="menuToggle"
              type="button"
              aria-label="Ukryj menu"
              title="Ukryj / pokaż menu"
              aria-controls="appSidebar"
              aria-expanded="true"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
            </button>
            <div class="breadcrumb">
              <span class="crumb-muted">Workspace</span>
              <span class="crumb-sep">/</span>
              <span class="crumb-current" id="pageTitle">Pulpit</span>
            </div>
          </div>

          <div class="topbar-right">
            <div class="theme-switcher" role="group" aria-label="Motyw kolorystyczny">
              <button
                type="button"
                class="theme-swatch is-active"
                data-theme-id="snappoint"
                title="snapPoint"
                aria-label="Motyw snapPoint"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-homeguide"
                data-theme-id="homeguide"
                title="HomeGuide"
                aria-label="Motyw HomeGuide"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-bluemint"
                data-theme-id="bluemint"
                title="Blue & Mint"
                aria-label="Motyw Blue and Mint"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-navyelectric"
                data-theme-id="navyelectric"
                title="Navy & Electric"
                aria-label="Motyw Navy blue and electric blue"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-royalgold"
                data-theme-id="royalgold"
                title="Royal Blue & Gold"
                aria-label="Motyw Dark royal blue and gold"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-brownbeige"
                data-theme-id="brownbeige"
                title="Brown & Beige"
                aria-label="Motyw Brown and beige"
              ></button>
              <button
                type="button"
                class="theme-swatch theme-swatch-classic"
                data-theme-id="classic"
                title="Classic"
                aria-label="Motyw Classic — czarno-biały"
              ></button>
            </div>
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" />
                <path d="m16 16 3.5 3.5" />
              </svg>
              <input type="search" placeholder="Szukaj dokumentu lub projektu…" />
            </div>
            <div class="user-chip" title="Anna Kowalska — Architekt" aria-label="Zalogowany: Anna Kowalska">
              <span class="avatar">AK</span>
            </div>
          </div>
        </header>

        <main class="content" id="content">
          <section class="workspace-bar panel">
            <div class="workspace-bar-body">
              <div class="workspace-actions">
                <button class="create-project" type="button" data-view="new-project">
                  <span class="plus-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path d="M12 5v14M5 12h14" />
                    </svg>
                    <span class="plus-label">Dodaj nowy projekt</span>
                  </span>
                </button>
                <button
                  class="tasks-calendar-btn"
                  type="button"
                  data-view="tasks-calendar"
                  title="Kalendarz zadań"
                >
                  <span class="plus-mark calendar-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <rect x="3.5" y="5" width="17" height="15" rx="2" />
                      <path d="M8 3.5v3M16 3.5v3M3.5 10h17" />
                    </svg>
                    <span class="plus-label">Kalendarz zadań</span>
                  </span>
                </button>
                <button
                  class="docs-home-btn"
                  type="button"
                  data-view="zalaczniki"
                  title="Załączniki"
                >
                  <span class="plus-mark docs-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path d="M8 4h7l3 3v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" />
                      <path d="M15 4v3h3M9 12h6M9 16h4" />
                    </svg>
                    <span class="plus-label">Załączniki</span>
                  </span>
                </button>
              </div>
            </div>
            <button
              type="button"
              class="clear-mock-icon"
              data-role="clear-mock-data"
              title="Wyczyść dane mockupu"
              aria-label="Wyczyść dane mockupu"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                <path d="M5 7h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8V7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M8 7l.7 11.2A1.8 1.8 0 0 0 10.5 20h3a1.8 1.8 0 0 0 1.8-1.8L16 7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </button>
          </section>

          <section class="grid-two dashboard-split">
            <article class="panel recent-projects-panel">
              <div class="panel-head">
                <h2>Projekty</h2>
                <a href="#" class="text-link" data-view="building-projects">Zobacz wszystkie</a>
              </div>
              <div class="recent-projects-body" id="recentProjectsBody">
                <div class="projects-watermark">
                  <div class="watermark-visual" aria-hidden="true">
                    <div class="orb orb-a"></div>
                    <div class="orb orb-b"></div>
                    <div class="doc-stack">
                      <div class="doc-sheet s1"></div>
                      <div class="doc-sheet s2"></div>
                      <div class="doc-sheet s3">
                        <span></span><span></span><span></span>
                      </div>
                    </div>
                  </div>
                  <p class="watermark-title">Brak zapisanych projektów</p>
                  <p class="watermark-hint">Użyj „Dodaj nowy projekt”, aby zacząć</p>
                </div>
              </div>
            </article>

            <aside class="ai-chat dashboard-chat" aria-label="Asystent AI">
              <header class="ai-chat-head">
                <div>
                  <p class="ai-chat-kicker">Asystent</p>
                  <h2>snapPoint AI</h2>
                </div>
                <div class="ai-chat-head-actions">
                  <span class="ai-chat-badge">Demo</span>
                  <button
                    type="button"
                    class="icon-btn ai-chat-toggle"
                    data-role="toggle-ai-chat"
                    title="Minimalizuj czat"
                    aria-label="Minimalizuj czat AI"
                    aria-expanded="true"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                      <path d="M9 6l6 6-6 6" />
                    </svg>
                  </button>
                </div>
              </header>
              <div class="ai-chat-messages" id="aiChatMessages"></div>
              <form class="ai-chat-composer" id="aiChatForm">
                <input
                  id="aiChatInput"
                  type="text"
                  placeholder="Zapytaj asystenta o projekt…"
                  autocomplete="off"
                />
                <button class="primary-btn ai-send" type="submit">Wyślij</button>
              </form>
            </aside>
          </section>
        </main>
      </div>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <button
      type="button"
      class="ai-chat-fab"
      id="aiChatFab"
      data-role="expand-ai-chat"
      title="Otwórz czat AI"
      aria-label="Otwórz czat snapPoint AI"
      hidden
    >
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="12" y="14" width="24" height="22" rx="7" fill="currentColor" opacity="0.14" />
        <rect x="14" y="16" width="20" height="18" rx="6" stroke="currentColor" stroke-width="1.8" />
        <circle cx="20.5" cy="24" r="2.2" fill="currentColor" />
        <circle cx="27.5" cy="24" r="2.2" fill="currentColor" />
        <path d="M21 30h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M24 10v4M18 11.5l1.8 2.8M30 11.5l-1.8 2.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="24" cy="9.2" r="1.5" fill="currentColor" />
      </svg>
    </button>
    <script src="survey-engine.js"></script>
    <script src="doc-forms.js"></script>
    <script src="app.js"></script>
    <script src="tutorial.js"></script>
  </body>
</html>
